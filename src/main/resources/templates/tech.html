<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Tests - Learning Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #2d4059 0%, #4a6572 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
        }
        .page-header {
            padding: 5rem 0 2rem;
            text-align: center;
        }
        .test-card {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }
        .test-card:hover {
            transform: translateY(-8px);
        }
        .test-icon {
            font-size: 3rem;
            color: #1f77b4;
            margin-bottom: 1rem;
        }
        .filter-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            color: white;
            border-radius: 50px;
            padding: 0.75rem 1.5rem;
            margin: 0.25rem;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(45deg, #764ba2, #667eea);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            color: white;
        }
        .level-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 1.5rem;
            margin: 0.5rem 0;
            transition: transform 0.3s ease;
        }
        .level-card:hover {
            transform: translateY(-3px);
        }
        .site-footer {
            background: rgba(17, 24, 39, 0.45);
            backdrop-filter: blur(8px);
            margin-top: auto;
        }
        .scroll-top-btn {
            position: fixed;
            right: 1rem;
            bottom: 1rem;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            z-index: 1200;
            display: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }
        .scroll-top-btn.show {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .options-container .form-check {
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 0.75rem 0.9rem 0.75rem 2.35rem;
            background: #f8f9fa;
            color: #1f2937;
        }
        .options-container .form-check-label {
            color: inherit;
            cursor: pointer;
            width: 100%;
        }
        html[data-theme="dark"] .test-card .options-container .form-check {
            background: rgba(15, 23, 42, 0.92);
            border-color: rgba(148, 163, 184, 0.36);
            color: #f8fafc;
        }
        html[data-theme="dark"] .test-card .options-container .form-check:has(.form-check-input:checked) {
            background: rgba(37, 99, 235, 0.22);
            border-color: rgba(147, 197, 253, 0.72);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
        }
        html[data-theme="dark"] .test-card .options-container .form-check-input {
            background-color: #0f172a;
            border-color: rgba(203, 213, 225, 0.72);
        }
        html[data-theme="dark"] .test-card .options-container .form-check-input:checked {
            background-color: #2563eb;
            border-color: #93c5fd;
        }
        html[data-theme="dark"] .test-card .bg-light {
            background-color: rgba(15, 23, 42, 0.92) !important;
            border: 1px solid rgba(148, 163, 184, 0.28);
            color: #f8fafc !important;
        }
    </style>
    <th:block th:replace="~{fragments/navbar :: navbarStyles}"></th:block>
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbarShell(false, false, 'tests', '/home', false, '')}"></nav>

    <section class="page-header">
        <div class="container">
            <h1>Technical Test Challenges</h1>
            <p>Choose a subject and take a skill-check test to measure your knowledge.</p>
        </div>
    </section>

    <section class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-12">
                <div th:if="${message}" class="alert alert-warning alert-dismissible fade show" role="alert">
                    <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div class="card test-card p-4">
                    <div class="text-center mb-4">
                        <a href="/flashcard" class="btn btn-outline-light mb-3">
                            <i class="fas fa-clone me-2"></i>Open Flashcard
                        </a>
                        <div class="d-flex flex-wrap justify-content-center gap-2 mb-4" role="group" aria-label="Tech filters">
                            <button type="button" class="btn filter-btn" data-filter="all">All</button>
                            <button type="button" class="btn filter-btn active" data-filter="Java">Java</button>
                            <button type="button" class="btn filter-btn" data-filter="SQL">SQL</button>
                            <button type="button" class="btn filter-btn" data-filter="Python">Python</button>
                            <button type="button" class="btn filter-btn" data-filter="BaseFramework">Base Framework</button>
                            <button type="button" class="btn filter-btn" data-filter="AI">AI</button>
                            <button type="button" class="btn filter-btn" data-filter="Database">Database</button>
                            <button type="button" class="btn filter-btn" data-filter="DSA">DSA</button>
                            <button type="button" class="btn filter-btn" data-filter="Git">Git</button>
                            <button type="button" class="btn filter-btn" data-filter="FrontEnd">FrontEnd</button>
                            <button type="button" class="btn filter-btn" data-filter="Fullstack">Fullstack</button>
                        </div>
                    </div>
                    <div id="techContent">
                        <div id="levelsContainer" class="row g-4">
                            <!-- Level cards will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="site-footer text-white">
        <div class="container py-4 text-center">
            <p class="mb-0">&copy; 2026 Learning Management System. All rights reserved.</p>
        </div>
    </footer>
    <button id="scrollTopBtn" class="scroll-top-btn" onclick="scrollToTop()" aria-label="Back to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script th:inline="javascript">
        const dsaAttemptCounts = /*[[${dsaAttemptCounts}]]*/ {};
        const dsaMaxAttempts = /*[[${dsaMaxAttempts}]]*/ 3;
        const frontEndAttemptCounts = /*[[${frontEndAttemptCounts}]]*/ {};
        const frontEndMaxAttempts = /*[[${frontEndMaxAttempts}]]*/ 5;
        const baseFrameworkAttemptCounts = /*[[${baseFrameworkAttemptCounts}]]*/ {};
        const baseFrameworkMaxAttempts = /*[[${baseFrameworkMaxAttempts}]]*/ 5;
        const aiAttemptCounts = /*[[${aiAttemptCounts}]]*/ {};
        const aiMaxAttempts = /*[[${aiMaxAttempts}]]*/ 5;
        const fullstackAttemptCounts = /*[[${fullstackAttemptCounts}]]*/ {};
        const fullstackMaxAttempts = /*[[${fullstackMaxAttempts}]]*/ 5;
        const testData = {
            Java: {
                icon: 'fab fa-java',
                title: 'Java Test',
                desc: '10 random MCQs per attempt from a 30-question bank covering syntax, OOP, collections, and JVM topics.',
                levels: {
                    'Java Pre-Intermediate': 'Basic Java concepts, syntax, and simple programs.',
                    'Java Intermediate': 'OOP principles, collections, exception handling, and design patterns.',
                    'Java Advanced': 'Concurrency, JVM internals, performance optimization, and complex algorithms.'
                }
            },
            SQL: {
                icon: 'fas fa-database',
                title: 'SQL Test',
                desc: 'Test your SQL skills with queries, joins, design, and database fundamentals.',
                levels: {
                    'SQL Pre-Intermediate': 'Basic SELECT, CRUD operations, filtering, and sorting.',
                    'SQL Intermediate': 'JOINs, GROUP BY, subqueries, and constraints.',
                    'SQL Advanced': 'Indexing, transactions, optimization, and database design.'
                }
            },
            Python: {
                icon: 'fab fa-python',
                title: 'Python Test',
                desc: 'Validate your Python scripting, data structures, and language proficiency.',
                levels: {
                    'Python Pre-Intermediate': 'Basic Python syntax, data types, and simple scripting.',
                    'Python Intermediate': 'Data structures, file handling, modules, and libraries.',
                    'Python Advanced': 'Advanced topics, frameworks, and complex problem-solving.'
                }
            },
            BaseFramework: {
                icon: 'fas fa-layer-group',
                title: 'Base Framework Test',
                desc: '10 random MCQs per attempt on Spring Boot DB setup, JPA, Hibernate, CRUD routes, and layered architecture.',
                levels: {
                    'Base Framework Pre-Intermediate': 'Spring Boot setup, datasource, JPA entities, REST basics, and layered architecture.',
                    'Base Framework Intermediate': 'Repository & Service layers, path/query params, relationships, and full CRUD APIs.',
                    'Base Framework Advanced': 'DTOs, validation, exception handling, JWT, CORS, and Clean Architecture concepts.'
                }
            },
            AI: {
                icon: 'fas fa-robot',
                title: 'AI Test',
                desc: 'Test your AI knowledge with basic concepts, models, and practical scenarios.',
                levels: {
                    'AI Pre-Intermediate': 'Basic AI concepts, machine learning fundamentals.',
                    'AI Intermediate': 'Neural networks, algorithms, and model training.',
                    'AI Advanced': 'Deep learning, NLP, computer vision, and AI ethics.'
                }
            },
            Database: {
                icon: 'fas fa-database',
                title: 'Database Test',
                desc: 'Assess your SQL and database design skills with practical query scenarios.',
                levels: {
                    'Database Pre-Intermediate': 'Basic SQL queries, CRUD operations, and normalization.',
                    'Database Intermediate': 'Joins, subqueries, indexing, and stored procedures.',
                    'Database Advanced': 'Database design, optimization, and NoSQL concepts.'
                }
            },
            DSA: {
                icon: 'fas fa-brain',
                title: 'DSA Test',
                desc: 'Challenge your algorithm and data structure skills with core programming problems.',
                levels: {
                    'DSA Pre-Intermediate': 'Basic data structures and simple algorithms.',
                    'DSA Intermediate': 'Sorting, searching, trees, and graphs.',
                    'DSA Advanced': 'Dynamic programming, advanced algorithms, and optimization.'
                }
            },
            Git: {
                icon: 'fab fa-git-alt',
                title: 'Git Test',
                desc: '10 random MCQs per attempt (order and options shuffled) from a larger Git question bank.',
                levels: {
                    'Git Pre-Intermediate': 'repos, staging, commits, remotes (random each attempt).',
                    'Git Intermediate': ' branches, merge, conflicts, stash (random each attempt).',
                    'Git Advanced': ' rebase, Git Flow, reflog, team workflows (random each attempt).'
                }
            },
            FrontEnd: {
                icon: 'fas fa-code',
                title: 'FrontEnd Test',
                desc: '10 random MCQs per attempt for HTML, CSS, JavaScript, accessibility, and performance.',
                levels: {
                    'FrontEnd Pre-Intermediate': 'HTML, CSS, JavaScript basics, forms, links, and selectors.',
                    'FrontEnd Intermediate': 'Responsive layouts, DOM events, Fetch API, semantic HTML, and storage.',
                    'FrontEnd Advanced': 'Performance, accessibility, hydration, security, and build optimization.'
                }
            },
            Fullstack: {
                icon: 'fas fa-laptop-code',
                title: 'Fullstack Test',
                desc: 'Evaluate your full-stack skills across front-end, back-end, and deployment workflows.',
                levels: {
                    'Fullstack Pre-Intermediate': 'Basic HTML, CSS, JavaScript, and simple back-end.',
                    'Fullstack Intermediate': 'Frameworks, databases, and API development.',
                    'Fullstack Advanced': 'Advanced architectures, deployment, and full-stack optimization.'
                }
            }
        };

        document.addEventListener('DOMContentLoaded', function() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            const levelsContainer = document.getElementById('levelsContainer');

            filterButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const filter = this.getAttribute('data-filter');

                    // Update active button
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');

                    // Populate levels
                    levelsContainer.innerHTML = '';
                    if (filter === 'all') {
                        // For all, show a message or nothing
                        levelsContainer.innerHTML = '<div class="col-12 text-center"><p class="text-muted">Select a specific technology to view available test levels.</p></div>';
                    } else {
                        const data = testData[filter];
                        Object.entries(data.levels).forEach(([level, desc]) => {
                            const tier = normalizeLevel(level, filter);
                            let btnDisabled = '';
                            if (filter === 'DSA') {
                                const used = Number(dsaAttemptCounts[tier] || 0);
                                if (used >= dsaMaxAttempts) {
                                    btnDisabled = 'disabled';
                                }
                            } else if (filter === 'FrontEnd') {
                                const used = Number(frontEndAttemptCounts[tier] || 0);
                                if (used >= frontEndMaxAttempts) {
                                    btnDisabled = 'disabled';
                                }
                            } else if (filter === 'BaseFramework') {
                                const used = Number(baseFrameworkAttemptCounts[tier] || 0);
                                if (used >= baseFrameworkMaxAttempts) {
                                    btnDisabled = 'disabled';
                                }
                            } else if (filter === 'AI') {
                                const used = Number(aiAttemptCounts[tier] || 0);
                                if (used >= aiMaxAttempts) {
                                    btnDisabled = 'disabled';
                                }
                            } else if (filter === 'Fullstack') {
                                const used = Number(fullstackAttemptCounts[tier] || 0);
                                if (used >= fullstackMaxAttempts) {
                                    btnDisabled = 'disabled';
                                }
                            }
                            const levelCard = document.createElement('div');
                            levelCard.className = 'col-md-4';
                            levelCard.innerHTML = `
                                <div class="card h-100 border-0 shadow-sm">
                                    <div class="card-body text-center">
                                        <i class="${data.icon} test-icon"></i>
                                        <h5 class="card-title">${level}</h5>
                                        <p class="card-text">${desc}</p>
                                        <button class="btn btn-primary start-test-btn" data-subject="${filter}" data-level="${level}" ${btnDisabled}>Start Test</button>
                                    </div>
                                </div>
                            `;
                            levelsContainer.appendChild(levelCard);
                        });
                    }
                });
            });

            // Add event listeners for start test buttons
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('start-test-btn')) {
                    const subject = e.target.getAttribute('data-subject');
                    const level = e.target.getAttribute('data-level');
                    startQuiz(subject, level);
                }
            });

            // Trigger initial load for Java
            document.querySelector('.filter-btn.active').click();
        });

        function normalizeLevel(level, subject) {
            const tiers = ['Pre-Intermediate', 'Intermediate', 'Advanced'];
            for (const tier of tiers) {
                if (level === tier || level.endsWith(tier)) {
                    return tier;
                }
            }
            return level;
        }

        function startQuiz(subject, level) {
            const normalizedLevel = normalizeLevel(level, subject);
            const tiers = ['Pre-Intermediate', 'Intermediate', 'Advanced'];
            if (tiers.includes(normalizedLevel)) {
                if (subject === 'DSA') {
                    const used = Number(dsaAttemptCounts[normalizedLevel] || 0);
                    if (used >= dsaMaxAttempts) {
                        return;
                    }
                } else if (subject === 'FrontEnd') {
                    const used = Number(frontEndAttemptCounts[normalizedLevel] || 0);
                    if (used >= frontEndMaxAttempts) {
                        return;
                    }
                } else if (subject === 'BaseFramework') {
                    const used = Number(baseFrameworkAttemptCounts[normalizedLevel] || 0);
                    if (used >= baseFrameworkMaxAttempts) {
                        return;
                    }
                } else if (subject === 'AI') {
                    const used = Number(aiAttemptCounts[normalizedLevel] || 0);
                    if (used >= aiMaxAttempts) {
                        return;
                    }
                } else if (subject === 'Fullstack') {
                    const used = Number(fullstackAttemptCounts[normalizedLevel] || 0);
                    if (used >= fullstackMaxAttempts) {
                        return;
                    }
                }
                window.location.href = `/quiz?subject=${encodeURIComponent(subject)}&level=${encodeURIComponent(normalizedLevel)}&fresh=1`;
                return;
            }
            alert(`Quiz for ${subject} ${level} is not available yet.`);
        }
    </script>

    <script>
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('scrollTopBtn');
            if (!btn) return;
            if (window.scrollY > 200) btn.classList.add('show');
            else btn.classList.remove('show');
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
