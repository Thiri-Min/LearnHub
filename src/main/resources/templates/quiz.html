<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - <span th:text="${subject}"></span> <span th:text="${level}"></span></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
        }
        .quiz-meta-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e9ecef;
        }
        .quiz-meta-bar .timer {
            font-size: 1.35rem;
            font-weight: 700;
            color: #dc3545;
        }
        .quiz-container {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            padding: 2rem;
            margin: 2rem auto;
            max-width: 800px;
        }
        .timer {
            font-size: 1.5rem;
            font-weight: bold;
            color: #dc3545;
        }
        .question {
            margin-bottom: 2rem;
        }
        .options {
            margin-bottom: 1rem;
        }
        .option {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option:hover {
            background: #e9ecef;
        }
        .option.selected {
            background: #007bff;
            color: white;
        }
        .site-footer {
            background: rgba(17, 24, 39, 0.45);
            backdrop-filter: blur(8px);
            margin-top: auto;
        }
        .review-item {
            text-align: left;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .review-item.correct {
            background: #d1e7dd;
            border: 1px solid #198754;
        }
        .review-item.incorrect {
            background: #f8d7da;
            border: 1px solid #dc3545;
        }
        .quiz-hint {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .quiz-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1rem;
        }
        .quiz-modal-overlay.show {
            display: flex;
        }
        .quiz-modal-box {
            background: #fff;
            color: #333;
            border-radius: 16px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
            max-width: 440px;
            width: 100%;
            padding: 1.75rem;
            text-align: center;
            animation: modalIn 0.2s ease-out;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .quiz-modal-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        .quiz-modal-icon.warning { background: #fff3cd; color: #856404; }
        .quiz-modal-icon.confirm { background: #e7f1ff; color: #0d6efd; }
        .quiz-modal-icon.loading { background: #f8f9fa; color: #6c757d; }
        .quiz-modal-box h5 { font-weight: 700; margin-bottom: 0.75rem; }
        .quiz-modal-box p { color: #6c757d; margin-bottom: 1.25rem; }
        .quiz-modal-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .result-card {
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
        }
        .result-grade {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
            margin: 0.5rem 0;
        }
        .result-grade.grade-a { color: #198754; }
        .result-grade.grade-b { color: #0d6efd; }
        .result-grade.grade-c { color: #fd7e14; }
        .result-grade.grade-d { color: #ffc107; }
        .result-grade.grade-f { color: #dc3545; }
        .save-status-box {
            border-radius: 12px;
            padding: 0.85rem 1rem;
            margin-bottom: 1.25rem;
            font-size: 0.95rem;
        }
        .save-status-box.success {
            background: #d1e7dd;
            border: 1px solid #198754;
            color: #0f5132;
        }
        .save-status-box.pending {
            background: #e7f1ff;
            border: 1px solid #0d6efd;
            color: #084298;
        }
        .save-status-box.error {
            background: #f8d7da;
            border: 1px solid #dc3545;
            color: #842029;
        }
    </style>
    <th:block th:replace="~{fragments/navbar :: navbarStyles}"></th:block>
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbarShell(false, false, 'tests', '/home', false, '')}"></nav>

    <div class="container flex-grow-1">
        <div class="quiz-container">
            <div class="quiz-meta-bar">
                <div>
                    <span class="text-muted small text-uppercase fw-semibold">Skill Test</span>
                    <h2 class="h5 mb-0" th:text="${subject} + ' — ' + ${level}">Quiz</h2>
                </div>
                <span class="timer" id="timer">20:00</span>
            </div>
            <div id="questionContainer">
                <!-- Questions will be loaded here -->
            </div>
            <p class="quiz-hint text-center mb-2" id="answerHint">Select an answer to continue.</p>
            <div class="d-flex justify-content-between align-items-center mt-4">
                <button type="button" id="prevBtn" class="btn btn-secondary invisible" aria-hidden="true">Previous</button>
                <span id="questionNumber">Question 1 of 10</span>
                <button type="button" id="nextBtn" class="btn btn-primary">Next</button>
            </div>
        </div>
    </div>

    <footer class="site-footer text-white">
        <div class="container py-4 text-center">
            <p class="mb-0">&copy; 2026 Learning Management System. All rights reserved.</p>
        </div>
    </footer>

    <div id="quizModalOverlay" class="quiz-modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="quiz-modal-box">
            <div id="quizModalIcon" class="quiz-modal-icon warning">
                <i id="quizModalIconEl" class="fas fa-exclamation-triangle"></i>
            </div>
            <h5 id="quizModalTitle">Notice</h5>
            <p id="quizModalMessage" class="mb-0"></p>
            <div id="quizModalActions" class="quiz-modal-actions mt-4"></div>
        </div>
    </div>

    <script th:inline="javascript">
        let currentQuestion = 0;
        const questions = /*[[${questions}]]*/ [];
        const subject = /*[[${subject}]]*/ 'Tech';
        const level = /*[[${level}]]*/ '';
        let answers = new Array(questions.length).fill(null);
        let timeLeft = level === 'Pre-Intermediate' ? 15 * 60 : 20 * 60;
        let quizSubmitted = false;
        let timerActive = true;

        const modalOverlay = document.getElementById('quizModalOverlay');
        const modalIcon = document.getElementById('quizModalIcon');
        const modalIconEl = document.getElementById('quizModalIconEl');
        const modalTitle = document.getElementById('quizModalTitle');
        const modalMessage = document.getElementById('quizModalMessage');
        const modalActions = document.getElementById('quizModalActions');

        function hideQuizModal() {
            modalOverlay.classList.remove('show');
            modalOverlay.setAttribute('aria-hidden', 'true');
            modalActions.innerHTML = '';
        }

        function showQuizModal({ type = 'warning', title, message, buttons = [] }) {
            modalIcon.className = 'quiz-modal-icon ' + type;
            if (type === 'loading') {
                modalIconEl.className = 'fas fa-spinner fa-spin';
            } else if (type === 'confirm') {
                modalIconEl.className = 'fas fa-clipboard-check';
            } else {
                modalIconEl.className = 'fas fa-exclamation-triangle';
            }
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modalActions.innerHTML = '';
            buttons.forEach(btn => {
                const el = document.createElement('button');
                el.type = 'button';
                el.className = btn.className || 'btn btn-primary';
                el.textContent = btn.label;
                el.addEventListener('click', () => {
                    hideQuizModal();
                    if (typeof btn.onClick === 'function') btn.onClick();
                });
                modalActions.appendChild(el);
            });
            modalOverlay.classList.add('show');
            modalOverlay.setAttribute('aria-hidden', 'false');
        }

        function showAlertModal(message, title = 'Please check') {
            showQuizModal({
                type: 'warning',
                title: title,
                message: message,
                buttons: [{ label: 'OK', className: 'btn btn-primary' }]
            });
        }

        function hasAnswered(index) {
            return answers[index] !== null && answers[index] !== undefined;
        }

        function countUnanswered() {
            return answers.filter(a => a === null || a === undefined).length;
        }

        function updateTimer() {
            if (!timerActive) return;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            if (timeLeft > 0) {
                timeLeft--;
                setTimeout(updateTimer, 1000);
            } else {
                submitQuiz(true);
            }
        }

        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const isFirst = currentQuestion === 0;
            const isLast = currentQuestion === questions.length - 1;

            prevBtn.classList.toggle('invisible', isFirst);
            prevBtn.setAttribute('aria-hidden', isFirst ? 'true' : 'false');
            prevBtn.disabled = isFirst;

            nextBtn.textContent = isLast ? 'Finish' : 'Next';
            nextBtn.classList.toggle('btn-success', isLast);
            nextBtn.classList.toggle('btn-primary', !isLast);
        }

        function loadQuestion(index) {
            const totalQuestions = questions.length;
            const question = questions[index];
            const container = document.getElementById('questionContainer');
            container.innerHTML = `
                <div class="question">
                    <h4>${index + 1}. ${question.question}</h4>
                    <div class="options">
                        ${question.options.map((option, i) => `
                            <div class="option ${answers[index] === i ? 'selected' : ''}" data-index="${i}" onclick="selectOption(${i})">
                                ${String.fromCharCode(65 + i)}. ${option}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('questionNumber').textContent = `Question ${index + 1} of ${totalQuestions}`;
            document.getElementById('answerHint').textContent = hasAnswered(index)
                ? 'You may go to the next question or go back to review.'
                : 'Select an answer before continuing — you cannot skip this question.';
            updateNavigation();
        }

        function selectOption(optionIndex) {
            answers[currentQuestion] = optionIndex;
            document.querySelectorAll('.option').forEach((el, i) => {
                el.classList.toggle('selected', i === optionIndex);
            });
            document.getElementById('answerHint').textContent = 'You may go to the next question or go back to review.';
        }

        function requireCurrentAnswer() {
            if (!hasAnswered(currentQuestion)) {
                showAlertModal('Please select an answer before continuing. You cannot skip a question.', 'Answer required');
                return false;
            }
            return true;
        }

        function confirmAndSubmit() {
            if (!requireCurrentAnswer()) return;

            const unanswered = countUnanswered();
            let message = 'Have you completed all questions and want to submit?';
            if (unanswered > 0) {
                message = `You still have ${unanswered} unanswered question(s). Submit anyway?`;
            }

            showQuizModal({
                type: 'confirm',
                title: 'Submit test?',
                message: message,
                buttons: [
                    { label: 'Cancel', className: 'btn btn-outline-secondary', onClick: () => {} },
                    { label: 'Submit', className: 'btn btn-success', onClick: () => submitQuiz(false) }
                ]
            });
        }

        function getCorrectIndex(question) {
            if (question.correctOption && question.options) {
                const byText = question.options.indexOf(question.correctOption);
                if (byText >= 0) return byText;
            }
            if (question.answer !== undefined && question.answer !== null) {
                return question.answer;
            }
            if (question.correct !== undefined && question.correct !== null) {
                return question.correct;
            }
            return -1;
        }

        function buildReviewHtml() {
            return questions.map((q, i) => {
                const userIdx = answers[i];
                const correctIdx = getCorrectIndex(q);
                const isCorrect = userIdx === correctIdx;
                const userText = userIdx !== null && userIdx !== undefined
                    ? `${String.fromCharCode(65 + userIdx)}. ${q.options[userIdx]}`
                    : 'No answer selected';
                const correctText = correctIdx >= 0
                    ? `${String.fromCharCode(65 + correctIdx)}. ${q.options[correctIdx]}`
                    : 'Answer not available';
                return `
                    <div class="review-item ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <strong>Question ${i + 1}</strong>
                            <span class="badge ${isCorrect ? 'bg-success' : 'bg-danger'}">${isCorrect ? 'Correct' : 'Incorrect'}</span>
                        </div>
                        <p class="mb-2"><strong>Question:</strong> ${q.question}</p>
                        <p class="mb-1 text-success"><strong>Correct answer:</strong> ${correctText}</p>
                        <p class="mb-0"><strong>Your answer:</strong> ${userText}</p>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion(currentQuestion);
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (!requireCurrentAnswer()) return;

            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion(currentQuestion);
            } else {
                confirmAndSubmit();
            }
        });

        function gradeClass(grade) {
            return 'grade-' + grade.toLowerCase();
        }

        function buildResultHtml({ score, total, percentage, grade, message, timeUp, saveStatus, saveMessage }) {
            const timeUpNote = timeUp
                ? '<div class="alert alert-warning py-2 mb-3"><i class="fas fa-clock me-1"></i>Time is up — your test was submitted automatically.</div>'
                : '';
            let saveBox = '';
            if (saveStatus === 'success') {
                saveBox = `<div class="save-status-box success"><i class="fas fa-check-circle me-1"></i>${saveMessage}</div>`;
            } else if (saveStatus === 'error') {
                saveBox = `<div class="save-status-box error"><i class="fas fa-exclamation-circle me-1"></i>${saveMessage}</div>`;
            } else {
                saveBox = `<div class="save-status-box pending"><i class="fas fa-spinner fa-spin me-1"></i>${saveMessage}</div>`;
            }
            return `
                <div class="result-card">
                    ${saveBox}
                    <h2 class="h3 mb-1">Test Complete</h2>
                    <p class="text-muted mb-3">${subject} · ${level}</p>
                    ${timeUpNote}
                    <div class="result-grade ${gradeClass(grade)}">${grade}</div>
                    <h3 class="h4 mb-2">Score: ${score} / ${total} (${percentage}%)</h3>
                    <p class="lead mb-0">${message}</p>
                </div>
                <hr class="my-4">
                <h4 class="mb-3 text-start">Question Review</h4>
                <div class="review-list" style="max-height: 420px; overflow-y: auto;">
                    ${buildReviewHtml()}
                </div>
                <div class="text-center mt-4">
                    <a href="/tech" class="btn btn-primary btn-lg">Back to Tech Tests</a>
                </div>
            `;
        }

        function renderResults(resultData, saveStatus, saveMessage) {
            document.querySelector('.quiz-container').innerHTML = buildResultHtml({
                ...resultData,
                saveStatus: saveStatus,
                saveMessage: saveMessage
            });
        }

        function updateSaveStatus(saveStatus, saveMessage) {
            const box = document.querySelector('.save-status-box');
            if (!box) return;
            box.className = 'save-status-box ' + saveStatus;
            const icon = saveStatus === 'success'
                ? '<i class="fas fa-check-circle me-1"></i>'
                : '<i class="fas fa-exclamation-circle me-1"></i>';
            box.innerHTML = icon + saveMessage;
        }

        async function submitQuiz(timeUp) {
            if (quizSubmitted) return;
            quizSubmitted = true;
            timerActive = false;
            hideQuizModal();

            const total = questions.length || 10;
            let score = 0;
            answers.forEach((answer, i) => {
                if (answer === getCorrectIndex(questions[i])) score++;
            });
            const percentage = total > 0 ? Math.round((score / total) * 100) : 0;

            let grade = 'F';
            let message = '';
            if (percentage >= 90) {
                grade = 'A';
                message = `Excellent work on ${subject} ${level}! You demonstrate strong mastery of the material.`;
            } else if (percentage >= 80) {
                grade = 'B';
                message = `Very good ${subject} performance. Review the questions below and polish any gaps.`;
            } else if (percentage >= 70) {
                grade = 'C';
                message = `Solid ${subject} foundation at ${level} level. Study the review below before retaking.`;
            } else if (percentage >= 60) {
                grade = 'D';
                message = `Fair attempt. Focus on core ${subject} concepts highlighted in the review.`;
            } else {
                grade = 'F';
                message = `Keep practicing ${subject} basics. Use the review below and try again when ready.`;
            }

            const resultData = { score, total, percentage, grade, message, timeUp };
            renderResults(resultData, 'pending', 'Saving your result…');

            const body = new URLSearchParams({
                subject: subject,
                level: level,
                score: String(score),
                total: String(total),
                percentage: String(percentage),
                grade: grade,
                timeUp: String(timeUp)
            });

            try {
                const response = await fetch('/quiz/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body
                });
                let data = null;
                try {
                    data = await response.json();
                } catch (parseError) {
                    data = null;
                }
                if (response.ok && data && data.ok) {
                    updateSaveStatus('success', 'Your result has been saved successfully.');
                } else {
                    const errText = (data && data.error)
                        ? data.error
                        : 'Your answers were graded, but the result could not be saved. Please try again later.';
                    updateSaveStatus('error', errText);
                }
            } catch (networkError) {
                updateSaveStatus('error', 'Could not reach the server. Your score is shown below but may not be saved.');
            }
        }

        updateTimer();
        loadQuestion(0);
    </script>
</body>
</html>
