<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  activeTech: tests | rich-content | mentoring | (empty)
  homeHref: / or /home
-->
<style th:fragment="navbarStyles">
    .lms-navbar {
        position: sticky;
        top: 0;
        z-index: 1100;
        backdrop-filter: blur(8px);
        background: rgba(27, 38, 59, 0.35) !important;
    }
    .lms-navbar .nav-link {
        color: rgba(255, 255, 255, 0.88);
    }
    .lms-navbar .nav-link:hover,
    .lms-navbar .nav-link:focus {
        color: #fff;
    }
    .lms-navbar .nav-link.active {
        color: #fff;
        font-weight: 600;
    }
    .lms-navbar .dropdown-menu {
        border: none;
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
        padding: 0.35rem;
    }
    .lms-navbar .dropdown-item {
        border-radius: 8px;
        padding: 0.5rem 0.85rem;
        font-weight: 500;
    }
    .lms-navbar .dropdown-item.active,
    .lms-navbar .dropdown-item:active {
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: #fff;
    }
    .lms-navbar .dropdown-item.active i {
        color: #fff;
    }
    .lms-navbar .nav-link.admin-link {
        color: #fbbf24 !important;
    }
    .lms-navbar .nav-link.admin-link:hover {
        color: #fde68a !important;
    }
    .lms-navbar .nav-link.admin-link.active {
        color: #fff !important;
        background: rgba(251, 191, 36, 0.2);
        border-radius: 8px;
    }
    .lms-navbar .nav-icon-link {
        min-width: 2.35rem;
        text-align: center;
    }
    .lms-navbar .nav-icon-badge {
        min-width: 1.15rem;
        height: 1.15rem;
        padding: 0 0.35rem;
        font-size: 0.68rem;
        line-height: 1.15rem;
    }
</style>

<th:block th:fragment="navbarShell(homeActive, coursesActive, activeTech, homeHref, useAuthModal, activeNav)">
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent lms-navbar">
        <div class="container">
            <a class="navbar-brand" href="/home">
                <i class="fas fa-graduation-cap me-2"></i>LMS
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul th:replace="~{fragments/navbar :: navLinks(${homeActive}, ${coursesActive}, ${activeTech}, ${homeHref}, ${useAuthModal}, ${activeNav})}"></ul>
            </div>
        </div>
    </nav>
    <th:block th:replace="~{fragments/navbar :: analyticsAndLoginTracking}"></th:block>
</th:block>

<th:block th:fragment="analyticsAndLoginTracking">
    <th:block th:if="${ga4MeasurementId != null and !#strings.isEmpty(ga4MeasurementId)}">
        <script async th:src="'https://www.googletagmanager.com/gtag/js?id=' + ${ga4MeasurementId}"></script>
        <script th:inline="javascript">
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            const gaMeasurementId = /*[[${ga4MeasurementId}]]*/ '';
            gtag('js', new Date());
            gtag('config', gaMeasurementId);

            const gaTrackLoginSuccess = /*[[${gaTrackLoginSuccess}]]*/ false;
            if (gaTrackLoginSuccess) {
                gtag('event', 'login_success', {
                    method: 'password'
                });
            }
        </script>
    </th:block>
    <script th:inline="javascript">
        function postLoginCountry(country) {
            const body = new URLSearchParams();
            body.append('location', country || 'Unknown');
            fetch('/api/track/location', { method: 'POST', body: body }).catch(function() {});
        }

        function countryFromCoordinates(lat, lng) {
            const url = 'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='
                + encodeURIComponent(lat) + '&longitude=' + encodeURIComponent(lng) + '&localityLanguage=en';
            return fetch(url)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.countryName) return data.countryName;
                    if (data.countryCode) return data.countryCode;
                    return 'Unknown';
                })
                .catch(function() { return null; });
        }

        function countryFromIp() {
            return fetch('https://ipapi.co/json/')
                .then(function(r) { return r.json(); })
                .then(function(data) { return data.country_name || data.country || null; })
                .catch(function() { return null; });
        }

        function trackLoginLocation() {
            function useIpFallback() {
                countryFromIp().then(function(country) {
                    postLoginCountry(country || 'Unknown (IP lookup failed)');
                });
            }

            if (!navigator.geolocation) {
                useIpFallback();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    countryFromCoordinates(pos.coords.latitude, pos.coords.longitude)
                        .then(function(country) {
                            if (country) {
                                postLoginCountry(country);
                            } else {
                                useIpFallback();
                            }
                        });
                },
                function() {
                    useIpFallback();
                },
                { timeout: 10000, maximumAge: 300000 }
            );
        }
    </script>
    <script th:if="${trackLocation}">
        document.addEventListener('DOMContentLoaded', trackLoginLocation);
    </script>
</th:block>

<ul th:fragment="navLinks(homeActive, coursesActive, activeTech, homeHref, useAuthModal, activeNav)"
    class="navbar-nav ms-auto align-items-lg-center">
    <li class="nav-item">
        <a class="nav-link" th:href="${homeHref}" th:classappend="${homeActive} ? 'active' : ''">Home</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="/courses" th:classappend="${coursesActive} ? 'active' : ''">Courses</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="/tutorials" th:classappend="${activeNav == 'tutorials'} ? 'active' : ''">Tutorials</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="/english-it" th:classappend="${activeNav == 'english-it'} ? 'active' : ''">English for IT</a>
    </li>
    <li class="nav-item" th:if="${user != null and !isAdminUser}">
        <a class="nav-link" href="/feedback" th:classappend="${activeNav == 'feedback'} ? 'active' : ''">Feedback</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="/contact" th:classappend="${activeNav == 'contact'} ? 'active' : ''">Contact</a>
    </li>
    <li class="nav-item dropdown" th:if="${user}">
        <a class="nav-link dropdown-toggle" href="#" id="techNavDropdown" role="button"
           data-bs-toggle="dropdown" aria-expanded="false"
           th:classappend="${activeTech != null and !#strings.isEmpty(activeTech)} ? 'active' : ''">Tech</a>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="techNavDropdown">
            <li>
                <a class="dropdown-item" th:href="@{/tech}"
                   th:classappend="${activeTech == 'tests'} ? 'active' : ''">
                    <i class="fas fa-clipboard-check me-2"></i>Skill Tests
                </a>
            </li>
            <li>
                <a class="dropdown-item" th:href="@{/rich-content}"
                   th:classappend="${activeTech == 'rich-content'} ? 'active' : ''">
                    <i class="fas fa-book-open me-2"></i>Rich Content
                </a>
            </li>
            <li>
                <a class="dropdown-item" th:href="@{/mentoring}"
                   th:classappend="${activeTech == 'mentoring'} ? 'active' : ''">
                    <i class="fas fa-users me-2"></i>Interactive Learning
                </a>
            </li>
        </ul>
    </li>
    <li class="nav-item" th:if="${user == null}">
        <a class="nav-link" href="/?authMode=login">Tech</a>
    </li>
    <li class="nav-item" th:if="${user}">
        <a class="nav-link nav-icon-link position-relative"
           id="navbarChatLink"
           th:href="${chatNotificationHref != null ? chatNotificationHref : '/mentoring'}"
           th:title="${isAdminUser} ? 'Mentor chat' : 'Mentee chat'"
           th:aria-label="${isAdminUser} ? 'Mentor chat notifications' : 'Mentee chat notifications'"
           th:classappend="${activeTech == 'mentoring'} ? 'active' : ''"
           th:attr="data-chat-href=${chatNotificationHref != null ? chatNotificationHref : '/mentoring'}">
            <i class="fas fa-comments"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger nav-icon-badge"
                  id="navbarChatBadge"
                  th:if="${chatNotificationCount != null and chatNotificationCount > 0}"
                  th:text="${chatNotificationCount > 99 ? '99+' : chatNotificationCount}">1</span>
        </a>
    </li>
    <li class="nav-item" th:if="${user}">
        <a class="nav-link nav-icon-link position-relative" href="/cart">
            <i class="fas fa-shopping-cart"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  th:if="${cartCount != null and cartCount > 0}" th:text="${cartCount}"></span>
        </a>
    </li>
    <li class="nav-item" th:if="${user}">
        <span class="nav-link">Hello, <span th:text="${user.firstName}"></span></span>
    </li>
    <li class="nav-item" th:if="${isAdminUser}">
        <a class="nav-link admin-link fw-semibold" href="/admin"
           th:classappend="${activeNav == 'admin'} ? 'active' : ''">
            <i class="fas fa-shield-halved me-1"></i>Admin
        </a>
    </li>
    <li class="nav-item" th:if="${user}">
        <a class="nav-link" href="/logout">Logout</a>
    </li>
    <li class="nav-item" th:if="${user}">
        <a class="nav-link" href="/profile">
            <i class="fas fa-user-circle me-1"></i>Profile
        </a>
    </li>
    <li class="nav-item" th:if="${user == null and !useAuthModal}">
        <a class="nav-link" href="/?authMode=login">Login</a>
    </li>
    <li class="nav-item" th:if="${user == null and useAuthModal}">
        <a class="nav-link" href="#authBox" onclick="showAuthBox('login'); return false;">Login</a>
    </li>
    <li class="d-none" th:if="${user}">
        <script th:inline="javascript">
            (function () {
                const link = document.getElementById('navbarChatLink');
                if (!link) {
                    return;
                }

                function setBadge(count) {
                    let badge = document.getElementById('navbarChatBadge');
                    if (count <= 0) {
                        if (badge) {
                            badge.remove();
                        }
                        return;
                    }
                    if (!badge) {
                        badge = document.createElement('span');
                        badge.id = 'navbarChatBadge';
                        badge.className = 'position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger nav-icon-badge';
                        link.appendChild(badge);
                    }
                    badge.textContent = count > 99 ? '99+' : String(count);
                }

                async function refreshChatNotifications() {
                    try {
                        const response = await fetch('/mentoring/chat/notifications', { cache: 'no-store' });
                        if (!response.ok) {
                            return;
                        }
                        const data = await response.json();
                        const count = Number(data.unreadCount || 0);
                        if (data.href) {
                            link.href = data.href;
                            link.dataset.chatHref = data.href;
                        }
                        setBadge(count);
                    } catch (error) {
                        // Keep the current badge when a transient request fails.
                    }
                }

                window.refreshNavbarChatNotifications = refreshChatNotifications;
                refreshChatNotifications();
                window.setInterval(refreshChatNotifications, 15000);
            })();
        </script>
    </li>
</ul>
</body>
</html>
