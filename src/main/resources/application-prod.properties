# Cloud profile for public hosting (Render, Railway, etc.)
# Optional: set SPRING_DATASOURCE_* to use MySQL instead of embedded H2.

server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# Use a persistent database in production. On Render, set SPRING_DATASOURCE_URL to a hosted database URL.
# If no external DB is configured, fallback to a local H2 file database for the current instance.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/demodb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Default admin (override in Render → Environment)
app.admin.email=${ADMIN_EMAIL:thirithiriminmin@gmail.com}
app.admin.username=${ADMIN_USERNAME:thiri}
app.admin.password=${ADMIN_PASSWORD:1234}
app.admin.first-name=${ADMIN_FIRST_NAME:Thiri}
app.admin.last-name=${ADMIN_LAST_NAME:Min}
# Keep admin password in sync on each deploy (needed for ephemeral H2 on Render)
app.admin.sync-password-on-startup=true

# Google Analytics 4
app.analytics.ga4-measurement-id=${GA4_MEASUREMENT_ID:G-9PPGQFYS8J}

# AI chatbot — OpenAI (primary) + Google Gemini (free tier backup)
app.ai.openai-api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.gemini-api-key=${GEMINI_API_KEY:}
app.ai.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}
app.ai.fallback-enabled=${AI_FALLBACK_ENABLED:true}

