spring.application.name=demo

# Load local secrets (gitignored) — copy from application-local.properties.example
spring.config.import=optional:classpath:application-local.properties

# MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/demo_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=march123@H
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Google Analytics 4
app.analytics.ga4-measurement-id=G-9PPGQFYS8J

# AI chatbot — OpenAI (primary) + Google Gemini (backup)
# Set keys in application-local.properties OR environment variables OPENAI_API_KEY / GEMINI_API_KEY
app.ai.openai-api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.gemini-api-key=${GEMINI_API_KEY:}
app.ai.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}
# Built-in answers if both APIs fail
app.ai.fallback-enabled=true

